version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: graphvoyage-db
    environment:
      POSTGRES_DB: travel_db
      POSTGRES_USER: travel_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_user -d travel_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphvoyage-network

  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: graphvoyage-app
    environment:
      - DATABASE_URL=postgresql://travel_user:${DB_PASSWORD:-dev_password}@db:5432/travel_db
      - GROQ_API_KEY=${GROQ_API_KEY}
      - AVIATIONSTACK_API_KEY=${AVIATIONSTACK_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - DEFAULT_ORIGIN_IATA=${DEFAULT_ORIGIN_IATA:-DAC}
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - graphvoyage-network

  # Adminer for database management (optional)
  adminer:
    image: adminer:latest
    container_name: graphvoyage-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - graphvoyage-network

volumes:
  postgres_data:

networks:
  graphvoyage-network:
    driver: bridge
