services:
  - type: web
    name: graphvoyageai
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: graphvoyage-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AVIATIONSTACK_API_KEY
        sync: false
      - key: DEFAULT_ORIGIN_IATA
        value: DAC
      - key: ENVIRONMENT
        value: production

databases:
  - name: graphvoyage-db
    databaseName: travel_db
    region: oregon
    plan: starter
    ipAllowList: []
