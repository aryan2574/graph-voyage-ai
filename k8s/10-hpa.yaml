# Horizontal Pod Autoscaler
# Automatically scales pods based on CPU/memory usage

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: graphvoyageai-hpa
  namespace: graphvoyage
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: graphvoyageai-app
  
  minReplicas: 2      # Minimum pods (never go below)
  maxReplicas: 10     # Maximum pods (never exceed)
  
  metrics:
  # Scale based on CPU usage
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # Scale up when avg CPU > 70%
  
  # Scale based on memory usage
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80  # Scale up when avg memory > 80%
  
  # Control scaling behavior
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
      - type: Percent
        value: 50           # Scale down max 50% of pods at a time
        periodSeconds: 60   # Every minute
    
    scaleUp:
      stabilizationWindowSeconds: 0    # Scale up immediately
      policies:
      - type: Percent
        value: 100          # Can double pods at once
        periodSeconds: 60
      - type: Pods
        value: 2            # Or add 2 pods at a time
        periodSeconds: 60
      selectPolicy: Max     # Choose the faster scaling policy
