apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphvoyage-ingress
  namespace: graphvoyage
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - graphvoyage.yourdomain.com  # Update with your domain
    secretName: graphvoyage-tls
  rules:
  - host: graphvoyage.yourdomain.com  # Update with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: graphvoyage-service
            port:
              number: 80
