# PostgreSQL Database Deployment
# Manages the lifecycle of PostgreSQL Pods
# Ensures 1 replica is always running

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: graphvoyage
  labels:
    app: postgres
    tier: database
spec:
  replicas: 1  # Only 1 replica for database (stateful workload)
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        
        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        
        # Environment variables from ConfigMap and Secret
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: graphvoyageai-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: graphvoyageai-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: graphvoyageai-secrets
              key: postgres-password
        
        # Persistent volume mount
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          subPath: postgres  # Prevents permission issues
        
        # Resource limits (important for production)
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Liveness probe: Restarts container if check fails
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U travel_user -d travel_db
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe: Marks container as ready to receive traffic
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U travel_user -d travel_db
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
